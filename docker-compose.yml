services:
  db:
    image: postgres:16-alpine
    container_name: statusping-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: statusping
      POSTGRES_USER: statusping
      POSTGRES_PASSWORD: statusping_secret
    ports:
      - "5432:5432"
    volumes:
      - statusping_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statusping -d statusping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: statusping-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://statusping:statusping_secret@db:5432/statusping
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_key_statusping_min_32_characters_long_12345}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_HOURS: 24
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-alerts@statusping.dev}
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: statusping-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  statusping_pgdata:
    name: statusping_pgdata
